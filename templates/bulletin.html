<!-- Email template. Placeholders: {{title}}, {{body}}, {{footer}}.
     Email clients ignore most CSS, so everything is inline and the layout is a
     single centred column. No external font, no image, no JavaScript. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
</head>
<body style="margin:0; padding:24px 12px; background:#f4f3f0; color:#1c1b19; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55;">
  <div style="max-width:620px; margin:0 auto; background:#ffffff; border:1px solid #e2ded6; border-radius:6px; padding:28px 30px;">
    {{body}}
    <hr style="border:0; border-top:1px solid #e2ded6; margin:26px 0 14px;">
    <p style="margin:0; color:#6b665e; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-size:12.5px;">
      {{footer}}
    </p>
  </div>
</body>
</html>
